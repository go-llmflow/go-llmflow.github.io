name: links

# A dead link on a landing page breaks nothing that complains, so every link of
# the BUILT site is checked (the layouts hold template expressions, not URLs).
#
# The checker is `landingkit links`, run at the version the landing's go.mod
# pins: `go run` without a version inside a module that requires
# github.com/go-fleettools/landingkit uses that requirement. It probes
# github.com blob links on raw.githubusercontent.com (see the landingkit
# README).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: every link and image resolves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: "0.167.0"
          extended: true
      - run: hugo --minify --destination ./public
      - name: Check
        env:
          GOWORK: "off"
        run: go run github.com/go-fleettools/landingkit/cmd/landingkit links public
      - name: Say the mantra once
        env:
          GOWORK: "off"
        run: go run github.com/go-fleettools/landingkit/cmd/landingkit check public
