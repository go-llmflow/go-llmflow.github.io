baseURL = "https://go-llmflow.github.io/"
title = "go-llmflow"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

[markup.goldmark.renderer]
  unsafe = true

# The design -- layouts/partials/styles.html, theme-toggle.html,
# fork-ribbon.html and icons/{github,book}.html -- comes from the shared Hugo
# module github.com/go-fleettools/landingkit, not from copies here: the copies
# drifted. Its version is pinned in go.mod (Renovate bumps it), and kit.go
# keeps `go mod tidy` from deleting that requirement. A file of the same name
# under layouts/partials/ would silently override the module's.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 9.48:1, bright on the dark background 5.16:1.
  base = "#134e4a"
  deep = "#0c302d"
  bright = "#0d9488"
  shadow = "rgba(19,78,74,.7)"
  glow = "rgba(19,78,74,.6)"
  wash = "rgba(19,78,74,.10)"
  washDeep = "rgba(12,48,45,.06)"
  chipBg = "#e2f2f1"
  chipBorder = "#b6dfdb"
  chipFg = "#0c302d"
  chipBgDark = "rgba(13,148,136,.14)"
  chipBorderDark = "rgba(13,148,136,.32)"
  chipFgDark = "#7ac4be"
  statsEnd = "#c5e5e2"
  bandText = "#d8eeec"

# Every field below is rendered by layouts/index.html (the cards in #repos and
# the strip under the hero). A field nothing renders does not stay true.
# "status": ready = released; active = on main, no version tagged yet.
# "label" (optional) replaces the status text on the card.
[[params.repos]]
  name   = "gateway"
  status = "ready"
  label  = "v0.33.0"
  url    = "https://github.com/go-llmflow/gateway"
  blurb  = "An OpenAI-compatible gateway in pure Go in front of vLLM: an organisation, team, project and key hierarchy with roles, budgets and rate limits in PostgreSQL, GPU-hour accounting, fair-share with borrowing, per-tenant prefix-cache isolation, and identity (OpenID Connect, single sign-on, SCIM), a hash-chained audit log, and guardrails on prompts and completions (`hide_secrets`, `pii`, Llama Guard, Prompt Guard; the HTTP adapter is off by default), and the endpoints coding agents use (stateless `/v1/responses`, the Anthropic `/v1/messages`), model fallbacks, OpenTelemetry traces, a server-rendered admin web UI and an MCP gateway with per-team tool allow-lists. durable accounting that survives a PostgreSQL outage. fallback to a spare model group when a pool is saturated or down. an opt-in Anthropic upstream (one API key per institution, guardrails required, billed in USD apart from GPU-hours). finance reports: project, lab and user attribution, a reports page with charts, CSV/XLSX/PDF exports and reconciliation with Slurm's `sreport`. optional high availability (several replicas sharing the pools through PostgreSQL). vLLM instances followed as Slurm jobs. hard budgets: a request starts only when every budget it falls under can pay its worst case. workload profiles: days per week per person, enforced by hard budgets. soft quotas, and decision reports on measured energy and on lending, chargeback by cost centre and a monthly report (mail now requires TLS), and Slurm against DCGM energy reconciliation, quotas and profiles in the report, and FinOps variance. Amazon Bedrock as an opt-in provider, under the same hard budgets: Claude, and since v0.25.0 Mistral, Llama and Nova through Converse. Cache writes of unknown lifetime are charged at the higher write price. per-pool shares: a pool can be apportioned by what each institution paid for that machine, with `borrow = \"shareholders\"` to keep it to the contributors. overhead measured from v0.6.0 to v0.24.0: +5 µs, then flat, about 60 µs. Since v0.27.0 a pool can lend its spare capacity to a third party (`borrow = \"spare\"`), billed its own energy, with the fixed costs (idle energy, cooling, racks) spread over all clients. several identity providers, one per institution, and federation proxies (eduGAIN, MyAccessID, Renater) filtered to a list of accepted institutions, for the admin login and for inference tokens (since v0.27.0), with accounts relative to an institution's domain: a person is local@domain, the domain checked against what the issuer may assert (since v0.29.0); `migrate-users` renames the users stored before it to name@domain, with their budgets, spend history and keys (v0.32.0; upgrade note: the gateway refuses to start with bare users while a domain is configured). Since v0.28.0 a month can be closed (immutable, audited snapshot, adjustments on the next open month), with depreciation billed to non-shareholders and credited to the owners, metered network and storage, and a markup per organisation. Since v0.31.0 the node's energy beyond the GPUs is metered from its BMC (Redfish) or a calibrated factor, a time-of-use tariff prices each local hour, and a sub-meter reading is shown against the measured energy. Since v0.33.0 a BMC that reports only a power is metered by the trapezoid of its samples. Since v0.34.0 `migrate-users` also renames the people who only have spend records (JWT-only callers), so one person keeps one history across the upgrade. **Current release v0.34.0:** `go install github.com/go-llmflow/gateway/cmd/llmflow-gateway@latest`."
[[params.repos]]
  name   = "pii"
  status = "ready"
  label  = "v0.2.0"
  url    = "https://github.com/go-llmflow/pii"
  blurb  = "Finds personal data in text, in pure Go with no dependencies (standard library only): e-mail, phone (E.164 and the French plan), IBAN (ISO 13616, mod 97), French NIR (INSEE key, 2A/2B), payment cards (Luhn and network prefix), IPv4 and IPv6. `pii.New(kinds...)`, `Scanner.Find(text)` returns `[]Match{Kind, Start, End}` and `pii.Mask` replaces them. On a benign corpus: 0 false positives for every kind except 1 phone. Used by the gateway's PII guardrail. v0.1.0 was quadratic on long runs of digits (1 MiB took 11 min 56 s, measured 2026-10-26 on a loaded machine); v0.2.0 fixes it and compares pii with Presidio. **Current release v0.2.0:** `go get github.com/go-llmflow/pii@v0.2.0`."
[[params.repos]]
  name   = "aws"
  status = "ready"
  label  = "v0.1.2"
  url    = "https://github.com/go-llmflow/aws"
  blurb  = "AWS Signature Version 4 request signing and AWS event-stream decoding, in pure Go with the standard library only (`CGO_ENABLED=0`). `sigv4` signs an `*http.Request`; `eventstream` decodes the `application/vnd.amazon.eventstream` framing with bounded sizes (16 MiB messages, 128 KiB of headers, 256 headers, 32767-byte values) and rejects a length underflow that the reference decoder allows. All 38 vectors of the aws-c-auth SigV4 suite pass; credentials are redacted in every print. Against aws-sdk-go-v2, measured 2026-11-03 (alternating rounds at a load of 4 or less, 10 kept): decoding 2.8, 2.3 and 1.10 times faster, signing a Bedrock request 2.0 % faster (2.940 µs against 3.001 µs, 48 allocations against 51) since v0.1.2, whose signing-key cache is keyed by `hash/maphash` and bounded to 256 entries. The gateway uses it for its Amazon Bedrock provider since v0.23.0, and a `sdk-witness` CI job compares its signatures with aws-sdk-go-v2's on the gateway's Bedrock paths. **Current release v0.1.2:** `go get github.com/go-llmflow/aws@v0.1.2`."
[[params.repos]]
  name   = "bench"
  status = "ready"
  label  = "v0.9.1"
  url    = "https://github.com/go-llmflow/bench"
  blurb  = "Measuring tools for LLM gateways, in pure Go. `gwbench` runs an interleaved A/B of gateways placed in front of one upstream and reports the latency each gateway **adds**, paired round by round against a direct call, with a load gate that refuses to measure on a busy machine and a planted-delay control; keys are read from files only. `fakevllm` is a recording fake vLLM (OpenAI chat completions and Anthropic Messages, JSON or SSE). An `e2e` suite checks the gateway against a real vLLM: priorities, preemption, prefix-cache isolation and accounting, and an OIDC suite that runs the gateway's JWT, single sign-on and SCIM paths against two real identity providers (dex and go-authn/bridge). `fakevllm` can also mimic Anthropic's API (429/529 with retry-after, prompt-cache usage, workspace headers), for an e2e suite of the gateway's Anthropic upstream. It also provides a fake slurmrestd and an end-to-end test of the gateway's Slurm discovery against a real Slurm. A live test runs two gateway replicas against PostgreSQL over HA mutual TLS, with a wrong-CA control, and a live test that the gateway's hard budgets keep usage within the worst case. **Current release v0.9.1:** `go install github.com/go-llmflow/bench/cmd/gwbench@latest`."
[[params.repos]]
  name   = "docs"
  status = "active"
  label  = "on main"
  url    = "https://go-llmflow.github.io/docs/"
  blurb  = "The documentation (Hugo + Hextra): the gateway's configuration, roles, identity, audit and logging, admin API, prefix-cache isolation, limitations and roadmap, how fair-share with borrowing works, and a guide to sharing a co-owned GPU cluster between two institutions with Slurm, vLLM and a gateway."
