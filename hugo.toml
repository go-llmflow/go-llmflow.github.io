baseURL = "https://go-llmflow.github.io/"
title = "go-llmflow"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

[markup.goldmark.renderer]
  unsafe = true

# The design -- layouts/partials/styles.html, theme-toggle.html,
# fork-ribbon.html and icons/{github,book}.html -- comes from the shared Hugo
# module github.com/go-fleettools/landingkit, not from copies here: the copies
# drifted. Its version is pinned in go.mod (Renovate bumps it), and kit.go
# keeps `go mod tidy` from deleting that requirement. A file of the same name
# under layouts/partials/ would silently override the module's.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 9.48:1, bright on the dark background 5.16:1.
  base = "#134e4a"
  deep = "#0c302d"
  bright = "#0d9488"
  shadow = "rgba(19,78,74,.7)"
  glow = "rgba(19,78,74,.6)"
  wash = "rgba(19,78,74,.10)"
  washDeep = "rgba(12,48,45,.06)"
  chipBg = "#e2f2f1"
  chipBorder = "#b6dfdb"
  chipFg = "#0c302d"
  chipBgDark = "rgba(13,148,136,.14)"
  chipBorderDark = "rgba(13,148,136,.32)"
  chipFgDark = "#7ac4be"
  statsEnd = "#c5e5e2"
  bandText = "#d8eeec"

# Every field below is rendered by layouts/index.html (the cards in #repos and
# the strip under the hero). A field nothing renders does not stay true.
# "status": ready = released; active = on main, no version tagged yet.
# "label" (optional) replaces the status text on the card.
[[params.repos]]
  name   = "gateway"
  status = "ready"
  label  = "v0.16.1"
  url    = "https://github.com/go-llmflow/gateway"
  blurb  = "An OpenAI-compatible gateway in pure Go in front of vLLM: an organisation, team, project and key hierarchy with roles, budgets and rate limits in PostgreSQL, GPU-hour accounting, fair-share with borrowing, per-tenant prefix-cache isolation, and identity (OpenID Connect, single sign-on, SCIM), a hash-chained audit log, and guardrails on prompts and completions (`hide_secrets`, `pii`, Llama Guard, Prompt Guard; the HTTP adapter is off by default), and the endpoints coding agents use (stateless `/v1/responses`, the Anthropic `/v1/messages`), model fallbacks, OpenTelemetry traces, a server-rendered admin web UI and an MCP gateway with per-team tool allow-lists. durable accounting that survives a PostgreSQL outage. fallback to a spare model group when a pool is saturated or down. an opt-in Anthropic upstream (one API key per institution, guardrails required, billed in USD apart from GPU-hours). finance reports: project, lab and user attribution, a reports page with charts, CSV/XLSX/PDF exports and reconciliation with Slurm's `sreport`. optional high availability (several replicas sharing the pools through PostgreSQL). vLLM instances followed as Slurm jobs. **Current release v0.16.1:** `go install github.com/go-llmflow/gateway/cmd/llmflow-gateway@latest`."
[[params.repos]]
  name   = "pii"
  status = "ready"
  label  = "v0.2.0"
  url    = "https://github.com/go-llmflow/pii"
  blurb  = "Finds personal data in text, in pure Go with no dependencies (standard library only): e-mail, phone (E.164 and the French plan), IBAN (ISO 13616, mod 97), French NIR (INSEE key, 2A/2B), payment cards (Luhn and network prefix), IPv4 and IPv6. `pii.New(kinds...)`, `Scanner.Find(text)` returns `[]Match{Kind, Start, End}` and `pii.Mask` replaces them. On a benign corpus: 0 false positives for every kind except 1 phone. Used by the gateway's PII guardrail. v0.1.0 was quadratic on long runs of digits (1 MiB took 11 min 56 s, measured 2026-10-26 on a loaded machine); v0.2.0 fixes it and compares pii with Presidio. **Current release v0.2.0:** `go get github.com/go-llmflow/pii@v0.2.0`."
[[params.repos]]
  name   = "bench"
  status = "ready"
  label  = "v0.5.0"
  url    = "https://github.com/go-llmflow/bench"
  blurb  = "Measuring tools for LLM gateways, in pure Go. `gwbench` runs an interleaved A/B of gateways placed in front of one upstream and reports the latency each gateway **adds**, paired round by round against a direct call, with a load gate that refuses to measure on a busy machine and a planted-delay control; keys are read from files only. `fakevllm` is a recording fake vLLM (OpenAI chat completions and Anthropic Messages, JSON or SSE). An `e2e` suite checks the gateway against a real vLLM: priorities, preemption, prefix-cache isolation and accounting, and an OIDC suite that runs the gateway's JWT, single sign-on and SCIM paths against two real identity providers (dex and go-authn/bridge). `fakevllm` can also mimic Anthropic's API (429/529 with retry-after, prompt-cache usage, workspace headers), for an e2e suite of the gateway's Anthropic upstream. It also provides a fake slurmrestd and an end-to-end test of the gateway's Slurm discovery against a real Slurm. **Current release v0.5.0:** `go install github.com/go-llmflow/bench/cmd/gwbench@latest`."
[[params.repos]]
  name   = "docs"
  status = "active"
  label  = "on main"
  url    = "https://go-llmflow.github.io/docs/"
  blurb  = "The documentation (Hugo + Hextra): the gateway's configuration, roles, identity, audit and logging, admin API, prefix-cache isolation, limitations and roadmap, how fair-share with borrowing works, and a guide to sharing a co-owned GPU cluster between two institutions with Slurm, vLLM and a gateway."
